<!DOCTYPE html>
<html>
   <head>
      <title>Email Signature Template</title>
      <meta name="author" content="Vinit Shahdeo">
      <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
      <meta name="format-detection" content="telephone=no">
      <link href="https://fonts.googleapis.com/css?family=Dosis" rel="stylesheet">
      <link href="https://fonts.googleapis.com/css?family=Caveat&display=swap" rel="stylesheet">
      <link href="https://fonts.googleapis.com/css?family=Caveat|Cookie&display=swap" rel="stylesheet">
      <link href="https://fonts.googleapis.com/css?family=Montserrat&display=swap" rel="stylesheet">
      <link href="https://fonts.googleapis.com/css?family=Delius&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.0.12/css/all.css" crossorigin="anonymous">
      <style type="text/css">
         a.link {margin:0;padding:0;border:none;text-decoration:none;}
         a {color:#4A90E2; text-decoration: none; transition: color 0.2s;}
         a:hover {color:#357ABD;}
         p { font-family: 'Delius', cursive; }
         #sig {font-family: 'Dosis', sans-serif;}
         table, tr, td {margin:0;padding:0;line-height: 1.8em;}
         td a {margin:0 1.2em 0 0}
         .container {
         position: absolute;
         top: 50%;
         left: 50%;
         transform: translate(-50%, -50%);
         background-color: #F4F6F7;
         width: 500px;
         height: auto;
         border-radius: 12px;
         overflow: hidden;
         padding: 40px;
         box-shadow: 0 4px 15px rgba(0,0,0,0.05);
         }
         .social-icons a {
         color: #566573;
         display: inline-block;
         margin-right: 15px;
         margin-top: 10px;
         }
         .social-icons a:hover {
         color: #4A90E2;
         }
      </style>
   </head>
   <body>
      <div class="container">
         <p><strong><code>From: abishalana15@gmail.com</code></strong><br><br>
            Привет! Это пример того, как будет выглядеть твоя новая подпись в конце каждого отправленного электронного письма. Тест стилей и шрифтов выполнен успешно.
         </p>
         
         <hr style="border: none; border-top: 1px solid #BDC3C7; margin: 25px 0;">

         <table id="sig" width='320' cellspacing='0' cellpadding='0' border-spacing='0'>
            <tr>
               <td>
                  <strong><span style="font-family:Caveat; font-weight:800;letter-spacing:.18em;color:#7d7d7d;">Best Regards,</span></strong>
               </td>
            </tr>
            <tr>
               <td>
                  <strong style="color:#273746;font-family:cookie;border:none;text-decoration:none;font-weight:700;font-size:2.2em;letter-spacing:.05em">Alana</strong>
               </td>
            </tr>
            <tr>
               <td>
                  <strong><span style="font-weight:600;letter-spacing:.15em;color:#4A90E2;">Frontend Developer / Student</span></strong>
               </td>
            </tr>
            <tr>
               <td>
                  <strong><span style="font-weight:600;letter-spacing:.05em;color:#7d7d7d;">Telegram</span></strong>
               </td>
            </tr>
            <tr>
               <td class="social-icons">
                  <a href="https://github.com/ferr-chik" target="_blank"><i class="fab fa-github fa-2x"></i></a>
                  <a href="https://linkedin.com/" target="_blank"><i class="fab fa-linkedin fa-2x"></i></a>
                  <a href="mailto:user@example.com"><i class="fas fa-envelope fa-2x"></i></a>
               </td>
            </tr>
         </table>
         <p>-----<br><span style="font-family: Montserrat; opacity: 0.4; font-size: 0.8em;">Customized Email Signature Template</span></p>
      </div>
   </body>
</html>
